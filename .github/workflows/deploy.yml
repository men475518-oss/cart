# もふもふカートを GitHub Pages へ公開するワークフロー。
# Vite でビルドした dist/ を gh-pages ブランチへ push する。
# 初回のみ GitHub の Settings > Pages で
#   Source: Deploy from a branch / Branch: gh-pages / フォルダ: / (root)
# を選んでください。
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/mario-kart-style-racing-game-mrez08
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build

      - name: gh-pages ブランチへ公開
        run: |
          set -euo pipefail
          touch dist/.nojekyll
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
          echo "公開しました: https://$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f1).github.io/$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f2)/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
